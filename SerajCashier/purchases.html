<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاتورة شراء - سراج LED</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --neon-border: #a855f7;
            --neon-glow: rgba(168, 85, 247, 0.4);
            --bg-dark-1: #070913;
            --bg-dark-2: #120f29;
            --card-bg: rgba(19, 17, 44, 0.88);
            --text-white: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, var(--bg-dark-1), var(--bg-dark-2)); 
            color: var(--text-white); 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        
        .header { 
            background: rgba(19, 17, 44, 0.95); 
            backdrop-filter: blur(12px); 
            color: var(--text-white); 
            padding: 15px 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            font-size: 22px; 
            font-weight: bold; 
            position: sticky; 
            top: 0; 
            z-index: 50; 
            border-bottom: 2px solid var(--neon-border);
            box-shadow: 0 0 25px var(--neon-glow);
        }

        .header-back-btn {
            background: #1d4ed8;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            padding: 3px 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.7);
            transition: all 0.2s;
        }
        .header-back-btn:active { transform: scale(0.95); filter: brightness(1.2); }
        .header-back-btn .arrow { color: white; font-size: 13px; line-height: 1; }
        .header-back-btn .text { color: white; font-size: 10px; font-weight: bold; font-family: sans-serif; letter-spacing: 0.5px; }

        .header-history-btn {
            background: rgba(19, 17, 44, 0.8);
            border: 1px solid var(--neon-border);
            border-radius: 12px;
            color: var(--text-white);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            box-shadow: 0 0 12px var(--neon-glow);
            transition: all 0.2s;
        }
        .header-history-btn:active { transform: scale(0.95); background: rgba(168, 85, 247, 0.25); }
        
        .purchases-container { padding: 15px; max-width: 800px; margin: auto; padding-bottom: 140px;}
        
        .search-container { position: relative; margin-bottom: 20px; display: flex; gap: 10px; align-items: center;}
        
        .search-input { flex: 1; padding: 14px; border: 2px solid var(--neon-border); border-radius: 16px; font-size: 18px; box-sizing: border-box; background: rgba(19, 17, 44, 0.6); box-shadow: 0 0 15px var(--neon-glow); outline: none; color: var(--text-white); font-weight: bold; transition: all 0.3s;}
        .search-input:focus { box-shadow: 0 0 30px rgba(168, 85, 247, 0.7); border-color: #ec4899; background: rgba(19, 17, 44, 0.9); }
        
        .quick-add-btn { background: rgba(7, 9, 19, 0.95); color: #00ff66; border: 2px solid #00ff66; border-radius: 16px; width: 55px; height: 55px; font-size: 26px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 15px rgba(0, 255, 102, 0.4); transition: all 0.2s;}
        .quick-add-btn:active { transform: scale(0.95); box-shadow: 0 0 25px rgba(0, 255, 102, 0.8); background: rgba(0, 255, 102, 0.2); }

        .dropdown-list { position: absolute; top: 100%; left: 0; right: 0; background: #13112c; border: 2px solid var(--neon-border); border-radius: 0 0 16px 16px; max-height: 250px; overflow-y: auto; z-index: 100; display: none; box-shadow: 0 15px 35px rgba(0,0,0,0.5);}
        .dropdown-item { padding: 12px 15px; border-bottom: 1px solid rgba(168, 85, 247, 0.2); cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-white); font-weight: bold; font-size: 16px;}
        .dropdown-item:active { background-color: rgba(168, 85, 247, 0.3); }
        .stock-badge { background: linear-gradient(135deg, #9333ea, #db2777); color: white; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold; box-shadow: 0 0 10px rgba(219, 39, 119, 0.5);}
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; text-align: center; font-size: 16px; background: rgba(19, 17, 44, 0.8); backdrop-filter: blur(10px); box-shadow: 0 0 20px var(--neon-glow); border-radius: 16px; overflow: hidden; border: 2px solid var(--neon-border);}
        table th { background-color: rgba(168, 85, 247, 0.25); padding: 14px 10px; border-bottom: 2px solid var(--neon-border); color: var(--text-white); font-weight: bold; font-size: 17px; text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);}
        table td { padding: 14px 10px; border-bottom: 1px solid rgba(168, 85, 247, 0.2); cursor: pointer; touch-action: pan-y; color: var(--text-white); font-weight: bold; font-size: 16px;}
        .swipe-row { transition: transform 0.1s ease-out, background 0.2s; background: rgba(19, 17, 44, 0.5); touch-action: pan-y; position: relative; }
        
        .total-display { display: none; font-size: 22px; font-weight: bold; color: var(--text-white); padding: 18px; background: rgba(19, 17, 44, 0.85); border: 2px solid var(--neon-border); border-radius: 16px; margin-bottom: 20px; text-align: center; box-shadow: 0 0 25px var(--neon-glow); text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);}
        .total-display span { color: #ff3333; text-shadow: 0 0 12px rgba(255, 51, 51, 0.9), 0 0 25px rgba(255, 51, 51, 0.5); font-weight: bold; }
        
        .save-btn { display: none; width: 100%; background: rgba(7, 9, 19, 0.95); color: var(--text-white); border: 2px solid #ec4899; padding: 18px; font-size: 22px; border-radius: 16px; cursor: pointer; font-weight: bold; box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); transition: all 0.2s;}
        .save-btn:active { transform: scale(0.98); box-shadow: 0 0 25px rgba(236, 72, 153, 0.8); background: rgba(236, 72, 153, 0.1); }
        .btn-save-ai { background: rgba(7, 9, 19, 0.95) !important; border: 2px solid #ec4899 !important; color: var(--text-white) !important; box-shadow: 0 0 15px rgba(236, 72, 153, 0.4) !important;}
        .btn-save-ai:active { background: rgba(236, 72, 153, 0.1) !important; }
        
        .bottom-print-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: rgba(19, 17, 44, 0.95); backdrop-filter: blur(10px); border-top: 2px solid var(--neon-border); padding: 12px 20px; display: none; justify-content: center; align-items: center; z-index: 200; box-shadow: 0 -4px 25px var(--neon-glow); }
        .bottom-print-btn { background: rgba(19, 17, 44, 0.85); color: var(--text-white); border: 2px solid var(--neon-border); border-radius: 20px; padding: 10px 25px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 0 15px var(--neon-glow); text-shadow: 0 0 8px rgba(255, 255, 255, 0.5); transition: all 0.2s;}
        .bottom-print-btn:active { box-shadow: 0 0 25px rgba(168, 85, 247, 0.8); filter: brightness(1.3); }
        
        .print-dropdown-menu { position: absolute; bottom: 65px; background: #13112c; border: 2px solid var(--neon-border); border-radius: 14px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); display: none; flex-direction: column; width: 220px; z-index: 250; overflow: hidden; text-align: right;}
        .print-dropdown-item { padding: 12px 15px; border-bottom: 1px solid rgba(168, 85, 247, 0.2); cursor: pointer; font-weight: bold; font-size: 15px; color: var(--text-white); text-shadow: 0 0 6px rgba(255, 255, 255, 0.4); transition: background 0.2s;}
        .print-dropdown-item:active { background-color: rgba(168, 85, 247, 0.3); }

        .toast-warning { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(220, 38, 38, 0.95); color: white; padding: 12px 20px; border-radius: 12px; z-index: 9999; display: none; font-size: 15px; font-weight: bold; text-align: center; width: 85%; max-width: 400px; box-shadow: 0 0 25px rgba(220, 38, 38, 0.6); border-right: 5px solid #991b1b;}
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5, 7, 15, 0.85); display: none; justify-content: center; align-items: center; z-index: 300; backdrop-filter: blur(8px);}
        .compact-modal { background: rgba(19, 17, 44, 0.95); padding: 25px; border-radius: 24px; width: 92%; max-width: 440px; box-shadow: 0 0 45px rgba(168, 85, 247, 0.6); max-height: 92vh; overflow-y: auto; border: 2px solid var(--neon-border);}
        .compact-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(168, 85, 247, 0.3); padding-bottom: 15px; margin-bottom: 20px;}
        .compact-header h3 { margin: 0; font-size: 20px; color: var(--text-white); text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);}
        
        .details-toggle-btn { background: rgba(19, 17, 44, 0.7); color: var(--text-white); border: 2px dashed var(--neon-border); width: 100%; padding: 10px; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 15px; box-shadow: 0 0 10px var(--neon-glow); transition: all 0.2s;}
        .details-toggle-btn:active { filter: brightness(1.3); }
        .hidden-details { display: none; background: rgba(19, 17, 44, 0.85); padding: 10px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(168, 85, 247, 0.4);}
        .batches-slider { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 10px; scroll-snap-type: x mandatory;}
        .batch-card { min-width: 140px; background: rgba(25, 22, 56, 0.9); border: 1px solid var(--neon-border); border-radius: 10px; padding: 10px; font-size: 13px; text-align: right; line-height: 1.6; flex-shrink: 0; color: var(--text-white); font-weight: bold;}

        .compact-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;}
        .compact-row label { font-size: 17px; font-weight: bold; color: var(--text-white); flex: 1; text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);}
        .compact-row input, .compact-row select, .compact-row textarea { width: 170px; padding: 10px; font-size: 18px; text-align: center; border: 2px solid var(--neon-border); border-radius: 14px; font-weight: bold; outline: none; background: rgba(19, 17, 44, 0.6); color: var(--text-white); box-shadow: 0 0 10px var(--neon-glow); transition: box-shadow 0.2s;}
        .compact-row input:focus, .compact-row select:focus, .compact-row textarea:focus { box-shadow: 0 0 25px rgba(168, 85, 247, 0.8); border-color: #ec4899; }
        .compact-row select option { background: #13112c; color: #ffffff; }
        
        .color-red-val { color: #ff3333 !important; font-weight: bold; text-shadow: 0 0 12px rgba(255, 51, 51, 0.9), 0 0 25px rgba(255, 51, 51, 0.5); }
        .color-green-val { color: #00ff66 !important; font-weight: bold; text-shadow: 0 0 12px rgba(0, 255, 102, 0.9), 0 0 25px rgba(0, 255, 102, 0.5); }

        .compact-supplier { margin-top: 18px; border-top: 2px solid rgba(168, 85, 247, 0.3); padding-top: 18px; display: flex; flex-direction: column; gap: 8px;}
        .compact-supplier label { font-size: 18px; font-weight: bold; color: var(--text-white); text-align: right; text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);}
        .compact-supplier input { width: 100%; padding: 14px; border: 2px solid var(--neon-border); border-radius: 16px; text-align: right; font-size: 19px; font-weight: bold; outline: none; background: rgba(19, 17, 44, 0.6); box-sizing: border-box; color: var(--text-white); box-shadow: 0 0 15px var(--neon-glow);}
        .compact-supplier input:focus { box-shadow: 0 0 30px rgba(168, 85, 247, 0.8); border-color: #ec4899;}
        
        .compact-btns { display: flex; gap: 15px; margin-top: 25px; border-top: 2px solid rgba(168, 85, 247, 0.3); padding-top: 20px;}
        .compact-btns button { flex: 1; border: none; font-size: 20px; font-weight: bold; cursor: pointer; padding: 14px; border-radius: 16px; box-shadow: 0 0 15px rgba(0,0,0,0.3); transition: all 0.2s;}
        .compact-btns button:active { transform: scale(0.97); filter: brightness(1.4); }
        .btn-close-ai { background: rgba(19, 17, 44, 0.8) !important; border: 2px solid var(--neon-border) !important; color: var(--text-white) !important; box-shadow: 0 0 12px var(--neon-glow) !important;}

        #liveSupplierBalance { font-size: 16px; font-weight: bold; text-align: center; margin-top: 10px; min-height: 20px; color: #e879f9; text-shadow: 0 0 8px rgba(232, 121, 249, 0.5); }
        
        #printReceiptArea { display: none; }
        @media print {
            @page { margin: 0; size: 80mm auto; }
            body { margin: 0; padding: 0; background: #fff; color: #000; }
            .header, .purchases-container, .modal-overlay, .toast-warning, .bottom-print-bar { display: none !important; }
            #printReceiptArea { display: block !important; width: 76mm; margin: 0 auto; padding: 5px; font-family: 'Segoe UI', Tahoma, sans-serif; direction: rtl; color: #000; }
            .print-header { font-size: 18px; font-weight: bold; margin-bottom: 5px; border-bottom: 1px dashed #000; padding-bottom: 5px; text-align: center;}
            .print-meta { font-size: 13px; margin-bottom: 8px; text-align: right; line-height: 1.4;}
            .print-table { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: 12px;}
            .print-table th { border-bottom: 1px solid #000; padding: 4px 0; text-align: center;}
            .print-table td { padding: 4px 0; border-bottom: 1px dotted #888; text-align: center;}
            .print-totals { border-top: 1px dashed #000; padding-top: 5px; text-align: right; font-size: 13px; font-weight: bold; line-height: 1.5;}
            .print-footer { text-align: center; font-size: 11px; margin-top: 8px; border-top: 1px dashed #000; padding-top: 5px;}
        }
    </style>
</head>
<body onclick="closeAllMenus(event);">

    <div class="header" id="mainHeader">
        <button class="header-back-btn" onclick="handleExit()">
            <span class="arrow">⬅</span>
            <span class="text">BACK</span>
        </button>
        <span id="pageTitleText" style="text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);">فاتورة شراء</span>
        <button class="header-history-btn" onclick="window.location.href='purchases_history.html'">
            <span style="font-size: 20px;">📋</span> السجل
        </button>
    </div>

    <div id="stockWarningToast" class="toast-warning"></div>

    <div class="purchases-container">
        <div class="search-container">
            <input type="text" id="productSearch" class="search-input" placeholder="ابحث عن منتج للشراء..." oninput="searchProducts()" onclick="this.select()">
            <button class="quick-add-btn" onclick="openQuickAddModal()">➕</button>
            <div id="productResults" class="dropdown-list"></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="text-align: right;">الصنف</th>
                    <th>س. الشراء</th>
                    <th>العدد</th>
                    <th>الإجمالي</th>
                </tr>
            </thead>
            <tbody id="invoiceItems"></tbody>
        </table>

        <div id="totalDisplayDiv" class="total-display">الإجمالي: <span id="mainTotal">0.00</span> جنيه</div>
        <button id="mainSaveBtn" class="save-btn" onclick="openSaveModal()">حفظ فاتورة الشراء</button>
    </div>

    <div class="bottom-print-bar" id="bottomPrintBar" onclick="event.stopPropagation()">
        <div style="position: relative;">
            <button class="bottom-print-btn" onclick="togglePrintMenu(event)">🖨️ طباعة / تصدير ▼</button>
            <div class="print-dropdown-menu" id="printDropdownMenu">
                <div class="print-dropdown-item" onclick="printLastInvoice()">🖨️ طباعة حرارية (80mm)</div>
                <div class="print-dropdown-item" onclick="exportLastInvoiceToExcel()">📊 تصدير Excel</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editModalOverlay" onclick="closeModals()">
        <div class="compact-modal" onclick="event.stopPropagation()">
            <div class="compact-header"><h3 id="editItemName">تعديل الصنف</h3></div>
            
            <button class="details-toggle-btn" onclick="toggleDetails()">+ عرض تفاصيل المخزن (للمقارنة)</button>
            <div class="hidden-details" id="hiddenDetailsBox">
                <div class="batches-slider" id="editBatchesSlider"></div>
                <div style="text-align: center; margin-top: 8px; font-weight: bold; color: var(--text-white);">
                    إجمالي الرصيد بالمخزن: <span id="editTotalStock">0</span>
                </div>
            </div>

            <div class="compact-row"><label>سعر الشراء (للقطعة):</label><input type="number" id="editPrice" onclick="this.select()"></div>
            <div class="compact-row"><label>سعر البيع للجمهور:</label><input type="number" id="editSellPrice" onclick="this.select()"></div>
            <div class="compact-row"><label>الكمية المشتراة:</label><input type="number" id="editQty" onclick="this.select()"></div>
            <input type="hidden" id="editItemIndex">
            
            <div class="compact-btns">
                <button class="btn-close-ai" onclick="closeModals()">إغلاق</button>
                <button class="btn-save-ai" onclick="saveItemEdit()">تأكيد و إدراج</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="saveModalOverlay" onclick="closeModals()">
        <div class="compact-modal" onclick="event.stopPropagation()">
            <div class="compact-header">
                <span style="color:#ffffff; font-size:20px; font-weight:bold; text-shadow:0 0 10px rgba(255,255,255,0.8);">تأكيد حفظ الشراء</span>
            </div>
            
            <div class="compact-row"><label>إجمالي الفاتورة</label><input type="number" id="modalTotal" class="color-red-val" value="0" readonly></div>
            <div class="compact-row"><label style="color:#00ff66;">المبلغ المدفوع منا</label><input type="number" id="modalPaid" class="color-green-val" value="0" onclick="this.select()" oninput="calculateModalTotals()"></div>
            <div class="compact-row"><label>المتبقي (آجل علينا)</label><input type="number" id="modalRemaining" value="0" readonly dir="ltr"></div>
            
            <div class="compact-row">
                <select id="modalVaultSelect" style="width: 170px;">
                    <option value="main">الخزينة الرئيسية (كاش)</option>
                    <option value="insta">إنستا (InstaPay)</option>
                    <option value="wallet">المحفظة الإلكترونية</option>
                </select>
                <textarea id="modalNotes" placeholder="ملاحظات..." style="width: 170px; height: 38px; padding: 6px; font-size: 15px; text-align: right; border: 2px solid var(--neon-border); border-radius: 14px; font-weight: bold; outline: none; background: rgba(19, 17, 44, 0.6); color: var(--text-white); resize: none; box-shadow: 0 0 10px var(--neon-glow);"></textarea>
            </div>

            <div class="compact-row" style="justify-content: center; background: rgba(19, 17, 44, 0.6); padding: 8px; border-radius: 12px; border: 1px dashed var(--neon-border); margin-bottom: 15px; box-shadow: 0 0 10px var(--neon-glow);">
                <label style="flex: none; margin-left: 8px; color: var(--text-white); font-size: 14px;">التاريخ:</label>
                <input type="date" id="modalDate" style="width: 150px; padding: 4px; font-size: 14px; background: rgba(19, 17, 44, 0.4); color: var(--text-white);">
            </div>
            
            <div class="compact-supplier" style="position:relative;">
                <label>اسم المورد</label>
                <input type="text" id="supplierSearch" placeholder="ادخل اسم المورد (أو اتركه للشراء النقدي)" oninput="handleSupplierInput()" onclick="this.select()">
                <div id="supplierResults" class="dropdown-list" style="bottom:100%; top:auto;"></div>
            </div>
            <div id="liveSupplierBalance"></div>
            
            <div class="compact-btns">
                <button class="btn-close-ai" onclick="closeModals()">إغلاق</button>
                <button class="btn-save-ai" onclick="confirmSave()">تأكيد الشراء</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="quickAddModalOverlay" onclick="closeModals()">
        <div class="compact-modal" onclick="event.stopPropagation()">
            <div class="compact-header"><h3 style="color:#00ff66; text-shadow:0 0 12px rgba(0,255,102,0.8);">إضافة منتج جديد للمخزن</h3></div>
            
            <div class="compact-row"><label>اسم المنتج:</label><input type="text" id="newProdName"></div>
            <div class="compact-row"><label>الصنف (اختياري):</label><input type="text" id="newProdCategory" value="عام"></div>
            <div class="compact-row"><label>سعر الشراء:</label><input type="number" id="newProdPurchase" value="0" onclick="this.select()"></div>
            <div class="compact-row"><label>سعر البيع:</label><input type="number" id="newProdPrice" value="0" onclick="this.select()"></div>
            
            <div class="compact-btns">
                <button class="btn-close-ai" onclick="closeModals()">إلغاء</button>
                <button class="btn-save-ai" style="background: linear-gradient(135deg, #059669, #10b981) !important; border-color: #34d399 !important; box-shadow: 0 0 20px rgba(16, 185, 129, 0.5) !important;" onclick="saveNewProductQuick()">حفظ المنتج</button>
            </div>
        </div>
    </div>

    <div id="printReceiptArea"></div>
<script src="db.js"></script>

<script>
    let productsDB = DB.getProducts();
    let suppliersDB = DB.getSuppliers();
    let purchaseInvoicesDB = DB.getPurchaseInvoices();
    let invoice = JSON.parse(localStorage.getItem('seraj_draft_purchase')) || [];
    let lastSavedInvoice = null; 

    function saveDraft() { localStorage.setItem('seraj_draft_purchase', JSON.stringify(invoice)); }

    window.onload = () => {
        if(typeof DB !== 'undefined') DB.applySavedTheme();
        let draft = JSON.parse(localStorage.getItem('seraj_draft_purchase')) || [];
        invoice = Array.isArray(draft) ? draft : [];
        renderTable();
    };

    function handleExit() { window.location.href = 'index.html'; }

    let stockWarningTimer;
    function showStockWarning(name, msg) {
        const toast = document.getElementById('stockWarningToast');
        toast.innerText = `تنبيه: ${name} - ${msg}`;
        toast.style.display = 'block';
        clearTimeout(stockWarningTimer);
        stockWarningTimer = setTimeout(() => { toast.style.display = 'none'; }, 5000);
    }

    function searchProducts() {
        const query = document.getElementById('productSearch').value.trim().toLowerCase();
        const resultsDiv = document.getElementById('productResults');
        resultsDiv.innerHTML = '';
        if(query.length === 0) { resultsDiv.style.display = 'none'; return; }

        const filtered = productsDB.filter(p => p.name.toLowerCase().includes(query));
        if(filtered.length > 0) {
            resultsDiv.style.display = 'block';
            filtered.forEach(p => {
                let totalStock = (p.lots && p.lots.length > 0) ? p.lots.reduce((sum, l) => sum + (l.stock || 0), 0) : (p.stock || 0);
                let dispPrice = (p.lots && p.lots.length > 0) ? p.lots[p.lots.length - 1].purchasePrice : (p.purchasePrice || 0);
                let dispSell = (p.lots && p.lots.length > 0) ? p.lots[p.lots.length - 1].price : (p.price || 0);
                
                const div = document.createElement('div'); div.className = 'dropdown-item';
                div.innerHTML = `<div><strong>${p.name}</strong><br><span style="color:#ff3333; font-size:14px;">شراء: ${dispPrice}</span> | <span style="color:#00ff66; font-size:14px;">بيع: ${dispSell}</span></div> <span class="stock-badge">${totalStock}</span>`;
                
                // التغيير هنا: عند اختيار الصنف، لا يضاف مباشرة بل يفتح نافذة التعديل لإدخال الكمية والأسعار
                div.onmousedown = (e) => { 
                    e.preventDefault(); 
                    openEditModalForNewItem(p); 
                };
                resultsDiv.appendChild(div);
            });
        }
    }

    function toggleDetails() { 
        const box = document.getElementById('hiddenDetailsBox'); 
        box.style.display = box.style.display === 'block' ? 'none' : 'block'; 
    }

    // دالة جديدة لفتح نافذة التعديل فور اختيار الصنف من قائمة البحث
    function openEditModalForNewItem(product) {
        document.getElementById('productSearch').value = ''; 
        document.getElementById('productResults').style.display = 'none';
        
        let dispPPrice = (product.lots && product.lots.length > 0) ? product.lots[product.lots.length - 1].purchasePrice : (product.purchasePrice || 0);
        let dispSell = (product.lots && product.lots.length > 0) ? product.lots[product.lots.length - 1].price : (product.price || 0);
        
        document.getElementById('editItemName').innerText = product.name;
        document.getElementById('editPrice').value = dispPPrice;
        document.getElementById('editSellPrice').value = dispSell;
        document.getElementById('editQty').value = 1; // كمية مبدئية
        
        // استخدام id الصنف بدلاً من index لأنه لم يضاف بعد للفاتورة
        document.getElementById('editItemIndex').value = 'new_' + product.id; 
        
        // ملء تفاصيل المخزن (الأكورديون)
        let slider = document.getElementById('editBatchesSlider');
        slider.innerHTML = ''; let totalStock = 0;

        if (product && product.lots && product.lots.length > 0) {
            product.lots.forEach(b => {
                totalStock += b.stock;
                slider.innerHTML += `
                    <div class="batch-card">
                        <div style="color:#00bfff; font-weight:bold;">مورد: ${b.supplier}</div>
                        <div>شراء: <span style="color:#ff1a40;">${b.purchasePrice}</span> ج</div>
                        <div>بيع: <span style="color:#00ff66;">${b.price}</span> ج</div>
                        <div>تاريخ: ${b.date}</div>
                        <div>كمية: <span style="color:#00ff66; font-weight:bold;">${b.stock}</span></div>
                    </div>
                `;
            });
        } else if (product) { 
            totalStock = product.stock || 0;
            slider.innerHTML = `
                <div class="batch-card" style="min-width:100%;">
                    <div>شراء: <span style="color:#ff1a40;">${product.purchasePrice || 0}</span> ج</div>
                    <div>كمية: <span style="color:#00ff66; font-weight:bold;">${totalStock}</span></div>
                </div>
            `;
        }

        document.getElementById('editTotalStock').innerText = totalStock;
        document.getElementById('hiddenDetailsBox').style.display = 'block'; // نعرضها عشان تقارن الأسعار

        document.getElementById('editModalOverlay').style.display = 'flex';
        // تركيز المؤشر على حقل الكمية لسهولة الإدخال
        setTimeout(() => document.getElementById('editQty').select(), 100);
    }

    // تعديل الدالة لتقبل الحفظ كصنف جديد أو تعديل صنف موجود
    function saveItemEdit() {
        let newPPrice = parseFloat(document.getElementById('editPrice').value) || 0;
        let newSPrice = parseFloat(document.getElementById('editSellPrice').value) || 0;
        let newQty = parseFloat(document.getElementById('editQty').value) || 1;

        // فرملة الطوارئ: منع سعر الشراء من أن يكون أعلى من سعر البيع
        if (newPPrice > newSPrice) {
            alert(`❌ تنبيه: لا يمكن أن يكون سعر الشراء (${newPPrice}) أعلى من سعر البيع (${newSPrice})! يرجى مراجعة الأسعار.`);
            return; // توقيف الدالة وعدم الحفظ
        }

        let indexVal = document.getElementById('editItemIndex').value;

        if (indexVal.startsWith('new_')) {
            // إضافة صنف جديد للفاتورة
            let prodId = parseInt(indexVal.split('_')[1]);
            let p = productsDB.find(x => x.id === prodId);
            if(p) {
                const existing = invoice.findIndex(item => item.id === p.id);
                if(existing > -1) {
                    invoice[existing].qty += newQty;
                    invoice[existing].purchasePrice = newPPrice;
                    invoice[existing].sellPrice = newSPrice;
                } else {
                    invoice.unshift({ ...p, purchasePrice: newPPrice, sellPrice: newSPrice, qty: newQty });
                }
            }
        } else {
            // تعديل صنف موجود بالفعل في الفاتورة
            let idx = parseInt(indexVal);
            invoice[idx].purchasePrice = newPPrice;
            invoice[idx].sellPrice = newSPrice;
            invoice[idx].qty = newQty;
        }

        saveDraft(); closeModals(); renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('invoiceItems');
        tbody.innerHTML = ''; let subTotal = 0;
        
        invoice.forEach((item, index) => {
            let itemPrice = parseFloat(item.purchasePrice) || 0;
            let itemQty = parseFloat(item.qty) || 0;
            let itemTot = itemPrice * itemQty;
            subTotal += itemTot;

            const tr = document.createElement('tr');
            tr.className = 'swipe-row';
            
            let startX = 0; let currentX = 0; let isDragging = false; let pressTimer = null;

            const onStart = (clientX) => {
                startX = clientX; currentX = startX; isDragging = true;
                pressTimer = setTimeout(() => {
                    if (isDragging && Math.abs(currentX - startX) < 10) { isDragging = false; openEditModal(index); }
                }, 600);
            };

            const onMove = (clientX) => {
                if (!isDragging) return;
                currentX = clientX; let diff = currentX - startX;
                if (Math.abs(diff) > 15) {
                    clearTimeout(pressTimer); tr.style.transform = `translateX(${diff}px)`; tr.style.opacity = `${1 - Math.abs(diff) / 300}`;
                }
            };

            const onEnd = () => {
                if (!isDragging) return;
                isDragging = false; clearTimeout(pressTimer); let diff = currentX - startX;
                if (Math.abs(diff) > 90) {
                    tr.style.transition = 'transform 0.25s ease, opacity 0.25s ease';
                    tr.style.transform = `translateX(${diff > 0 ? 100 : -100}%)`; tr.style.opacity = '0';
                    setTimeout(() => { invoice.splice(index, 1); saveDraft(); renderTable(); }, 250);
                } else {
                    tr.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
                    tr.style.transform = 'translateX(0)'; tr.style.opacity = '1';
                }
            };

            tr.onmousedown = (e) => { onStart(e.clientX); }; tr.onmousemove = (e) => { onMove(e.clientX); };
            tr.onmouseup = (e) => { onEnd(); }; tr.onmouseleave = (e) => { if(isDragging) onEnd(); };
            tr.ontouchstart = (e) => { onStart(e.touches[0].clientX); }; tr.ontouchmove = (e) => { onMove(e.touches[0].clientX); }; tr.ontouchend = (e) => { onEnd(); };

            tr.onclick = () => {
                if (Math.abs(currentX - startX) < 10) {
                    openEditModal(index); // تم التعديل لتفتح نافذة التعديل بدلا من زيادة العدد بـ 1
                }
            };

            tr.innerHTML = `<td style="text-align: right; font-weight:bold; color: var(--text-white);">${item.name}</td><td style="color: var(--text-white); font-weight:bold;">${itemPrice.toFixed(2)}</td><td style="font-weight:bold; color: var(--text-white);">${itemQty}</td><td style="font-weight:bold; color: #ff3333; text-shadow: 0 0 12px rgba(255, 51, 51, 0.9);">${itemTot.toFixed(2)}</td>`;
            tbody.appendChild(tr);
        });
        
        document.getElementById('mainTotal').innerText = subTotal.toFixed(2);

        let totalDiv = document.getElementById('totalDisplayDiv');
        let saveBtn = document.getElementById('mainSaveBtn');
        if(invoice.length === 0) {
            totalDiv.style.display = 'none'; saveBtn.style.display = 'none';
        } else {
            totalDiv.style.display = 'block'; saveBtn.style.display = 'block';
        }
    }

    function openEditModal(index) {
        document.getElementById('editItemName').innerText = invoice[index].name;
        document.getElementById('editPrice').value = invoice[index].purchasePrice;
        document.getElementById('editSellPrice').value = invoice[index].sellPrice || invoice[index].price;
        document.getElementById('editQty').value = invoice[index].qty;
        document.getElementById('editItemIndex').value = index;
        
        // ملء تفاصيل المخزن (الأكورديون)
        let p = productsDB.find(x => x.id === invoice[index].id);
        let slider = document.getElementById('editBatchesSlider');
        slider.innerHTML = ''; let totalStock = 0;

        if (p && p.lots && p.lots.length > 0) {
            p.lots.forEach(b => {
                totalStock += b.stock;
                slider.innerHTML += `
                    <div class="batch-card">
                        <div style="color:#00bfff; font-weight:bold;">مورد: ${b.supplier}</div>
                        <div>شراء: <span style="color:#ff1a40;">${b.purchasePrice}</span> ج</div>
                        <div>بيع: <span style="color:#00ff66;">${b.price}</span> ج</div>
                        <div>تاريخ: ${b.date}</div>
                        <div>كمية: <span style="color:#00ff66; font-weight:bold;">${b.stock}</span></div>
                    </div>
                `;
            });
        } else if (p) { 
            totalStock = p.stock || 0;
            slider.innerHTML = `
                <div class="batch-card" style="min-width:100%;">
                    <div>شراء: <span style="color:#ff1a40;">${p.purchasePrice || 0}</span> ج</div>
                    <div>كمية: <span style="color:#00ff66; font-weight:bold;">${totalStock}</span></div>
                </div>
            `;
        }

        document.getElementById('editTotalStock').innerText = totalStock;
        document.getElementById('hiddenDetailsBox').style.display = 'none';
        
        document.getElementById('editModalOverlay').style.display = 'flex';
    }

    function openSaveModal() {
        if(invoice.length === 0) return alert("الفاتورة فارغة!");
        let sub = parseFloat(document.getElementById('mainTotal').innerText) || 0;
        document.getElementById('modalTotal').value = sub.toFixed(2);
        document.getElementById('modalNotes').value = '';
        
        let draftSup = localStorage.getItem('seraj_draft_supplier') || '';
        document.getElementById('supplierSearch').value = draftSup;
        handleSupplierInput();

        let t = new Date();
        document.getElementById('modalDate').value = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
        document.getElementById('modalPaid').value = document.getElementById('modalTotal').value; 
        calculateModalTotals();
        document.getElementById('saveModalOverlay').style.display = 'flex';
    }

    function handleSupplierInput() {
        const query = document.getElementById('supplierSearch').value.trim().toLowerCase();
        const resultsDiv = document.getElementById('supplierResults');
        resultsDiv.innerHTML = ''; 
        if(query.length === 0) { resultsDiv.style.display = 'none'; updateLiveSupplierBalanceUI(null); return; }
        
        const exactMatch = suppliersDB.find(s => s.name.toLowerCase() === query);
        updateLiveSupplierBalanceUI(exactMatch);
        
        const filtered = suppliersDB.filter(s => s.name.toLowerCase().includes(query));
        if(filtered.length > 0) {
            resultsDiv.style.display = 'block';
            filtered.forEach(s => {
                const div = document.createElement('div'); div.className = 'dropdown-item'; div.innerHTML = `<strong>${s.name}</strong>`;
                div.onmousedown = (e) => { 
                    e.preventDefault(); 
                    document.getElementById('supplierSearch').value = s.name; 
                    resultsDiv.style.display = 'none';
                    updateLiveSupplierBalanceUI(s); 
                };
                resultsDiv.appendChild(div);
            });
        }
    }

    function updateLiveSupplierBalanceUI(supplier) {
        const balDiv = document.getElementById('liveSupplierBalance');
        if (supplier) {
            let net = supplier.balance || 0;
            if (net > 0) {
                balDiv.innerHTML = `رصيد سابق: <span style="color:#00ff66; text-shadow:0 0 8px rgba(0,255,102,0.6);">${net} (له)</span>`;
            } else if (net < 0) {
                balDiv.innerHTML = `رصيد سابق: <span style="color:#ff3333; text-shadow:0 0 8px rgba(255,51,51,0.6);">${Math.abs(net)} (لنا)</span>`;
            } else {
                balDiv.innerHTML = `رصيد سابق: <span style="color:#ffffff;">0 (صافي)</span>`;
            }
        } else {
            balDiv.innerHTML = `<span style="color:#e879f9;">مورد جديد - الرصيد: 0</span>`;
        }
    }

    function calculateModalTotals() {
        let finalReq = parseFloat(document.getElementById('modalTotal').value) || 0;
        let paid = parseFloat(document.getElementById('modalPaid').value) || 0;
        document.getElementById('modalRemaining').value = (finalReq - paid).toFixed(2);
    }

    function confirmSave() {
        try {
            let finalReq = parseFloat(document.getElementById('modalTotal').value) || 0;
            let inputPaid = parseFloat(document.getElementById('modalPaid').value) || 0;
            let suppName = document.getElementById('supplierSearch').value.trim();
            let vaultKey = document.getElementById('modalVaultSelect').value;
            let invDate = document.getElementById('modalDate').value;
            let notes = document.getElementById('modalNotes').value.trim();

            if(suppName === "null" || suppName === "مورد نقدي" || suppName === "بدون مورد") {
                suppName = "";
            }

            let actualPaid = inputPaid;
            let vaultAmount = inputPaid;

            if (suppName === "") {
                if (inputPaid > finalReq) {
                    actualPaid = finalReq;
                    vaultAmount = finalReq;
                }
            }

            let remaining = finalReq - actualPaid;
            remaining = Math.round(remaining * 100) / 100;

            if (remaining > 0 && suppName === "") {
                alert("❌ تنبيه هام: الفاتورة بها متبقي (آجل علينا)! يجب إدخال اسم المورد.");
                return;
            }

            let prevBal = 0, currBal = 0;
            if (suppName !== "") {
                let s = suppliersDB.find(x => x.name === suppName);
                if (s) { prevBal = s.balance; s.balance += remaining; currBal = s.balance; }
                else { let newS = { id: Date.now(), name: suppName, balance: remaining }; suppliersDB.push(newS); currBal = remaining; }
                DB.saveSuppliers(suppliersDB);
            }

            let formattedItems = invoice.map(item => ({
                id: item.id, name: item.name,
                purchasePrice: item.purchasePrice,
                price: item.sellPrice || item.price, 
                qty: item.qty,
                total: (parseFloat(item.purchasePrice) || 0) * (parseFloat(item.qty) || 0)
            }));

            formattedItems.forEach(item => {
                let p = productsDB.find(x => x.id === item.id);
                if (p) {
                    if (!p.lots) p.lots = [];
                    p.lots.unshift({
                        supplier: suppName || "شراء نقدي",
                        stock: item.qty,
                        purchasePrice: item.purchasePrice,
                        price: item.price,
                        date: invDate
                    });
                }
            });
            DB.saveProducts(productsDB);

            if (vaultAmount > 0) {
                let vData = DB.getVaults();
                if(!vData[vaultKey]) vData[vaultKey] = 0;
                vData[vaultKey] -= vaultAmount; 
                DB.saveVaults(vData);

                let tMoves = DB.getTreasuryMoves();
                tMoves.push({
                    id: Date.now(), type: 'purchase', vault: vaultKey, 
                    amountAdd: 0, amountDeduct: vaultAmount,
                    notes: `فاتورة مشتريات - المورد: ${suppName !== "" ? suppName : 'نقدي'}`, date: invDate
                });
                DB.saveTreasuryMoves(tMoves);
            }

            let purchaseInvoiceId = 1000;
            if (purchaseInvoicesDB && purchaseInvoicesDB.length > 0) {
                let maxId = 1000;
                purchaseInvoicesDB.forEach(i => {
                    let iId = parseInt(i.id);
                    if (!isNaN(iId) && iId > maxId && iId < 10000000000) { maxId = iId; }
                });
                purchaseInvoiceId = maxId + 1;
            }

            lastSavedInvoice = {
                id: purchaseInvoiceId, date: invDate, supplier: suppName !== "" ? suppName : null,
                total: finalReq, remaining: remaining, paid: actualPaid, vault: vaultKey,
                notes: notes, items: formattedItems
            };
            
            purchaseInvoicesDB.push(lastSavedInvoice);
            DB.savePurchaseInvoices(purchaseInvoicesDB);

            localStorage.removeItem('seraj_draft_supplier');
            localStorage.removeItem('seraj_draft_purchase');
            invoice = []; 
            renderTable();

            closeModals();
            
            let printBar = document.getElementById('bottomPrintBar');
            printBar.style.display = 'flex';
            setTimeout(() => { printBar.style.display = 'none'; }, 10000);

        } catch(err) {
            console.error("خطأ أثناء الحفظ:", err);
            alert("حدث خطأ أثناء الحفظ: " + err.message);
        }
    }

    function openQuickAddModal() {
        document.getElementById('newProdName').value = document.getElementById('productSearch').value;
        document.getElementById('newProdCategory').value = 'عام';
        document.getElementById('newProdPurchase').value = '';
        document.getElementById('newProdPrice').value = '';
        document.getElementById('quickAddModalOverlay').style.display = 'flex';
    }

    function saveNewProductQuick() {
        let name = document.getElementById('newProdName').value.trim();
        let cat = document.getElementById('newProdCategory').value.trim() || "عام";
        let pPrice = parseFloat(document.getElementById('newProdPurchase').value) || 0;
        let sPrice = parseFloat(document.getElementById('newProdPrice').value) || 0;

        if(!name) return alert("أدخل اسم المنتج!");
        
        // فرملة الطوارئ للمنتجات الجديدة أيضاً
        if(pPrice > sPrice) {
            alert(`❌ تنبيه: سعر الشراء (${pPrice}) لا يمكن أن يكون أعلى من سعر البيع (${sPrice})!`);
            return;
        }
        
        let newProd = {
            id: Date.now(),
            name: name,
            category: cat,
            purchasePrice: pPrice,
            price: sPrice,
            stock: 0,
            lots: []
        };
        productsDB.push(newProd);
        DB.saveProducts(productsDB);
        
        document.getElementById('quickAddModalOverlay').style.display = 'none';
        
        // يفتح نافذة إدخال الكمية مباشرة للمنتج الجديد بعد حفظه
        openEditModalForNewItem(newProd);
    }

    function togglePrintMenu(e) {
        if (e) e.stopPropagation();
        let m = document.getElementById('printDropdownMenu');
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }

    function closeAllMenus(e) {
        let m = document.getElementById('printDropdownMenu');
        if(m) m.style.display = 'none';
        let sRes = document.getElementById('supplierResults');
        if(sRes) sRes.style.display = 'none';
        let pRes = document.getElementById('productResults');
        if(pRes) pRes.style.display = 'none';
    }

    function closeModals() { 
        document.getElementById('editModalOverlay').style.display = 'none'; 
        document.getElementById('saveModalOverlay').style.display = 'none'; 
        document.getElementById('quickAddModalOverlay').style.display = 'none';
    }

    function printLastInvoice() {
        if(!lastSavedInvoice) return;
        let sub = 0; let itemsHtml = '';
        lastSavedInvoice.items.forEach(item => {
            sub += item.total;
            itemsHtml += `<tr><td>${item.name}</td><td>${item.purchasePrice}</td><td>${item.qty}</td><td>${item.total.toFixed(2)}</td></tr>`;
        });

        let printHtml = `
            <div class="print-header">محلات سراج LED</div>
            <div class="print-meta">
                رقم الفاتورة: ${lastSavedInvoice.id}<br>
                التاريخ: ${lastSavedInvoice.date}<br>
                المورد: ${lastSavedInvoice.supplier || "نقدي"}<br>
                ${lastSavedInvoice.notes ? 'ملاحظات: ' + lastSavedInvoice.notes + '<br>' : ''}
            </div>
            <table class="print-table">
                <thead><tr><th>الصنف</th><th>س.شراء</th><th>الكمية</th><th>الإجمالي</th></tr></thead>
                <tbody>${itemsHtml}</tbody>
            </table>
            <div class="print-totals">
                الإجمالي: ${sub.toFixed(2)}<br>
                المدفوع: ${lastSavedInvoice.paid.toFixed(2)}<br>
                المتبقي: ${lastSavedInvoice.remaining.toFixed(2)}
            </div>
            <div class="print-footer">نسخة مشتريات (للحفظ)</div>
        `;
        document.getElementById('printReceiptArea').innerHTML = printHtml;
        window.print();
        document.getElementById('bottomPrintBar').style.display = 'none';
        lastSavedInvoice = null;
    }

    function exportLastInvoiceToExcel() {
        if(!lastSavedInvoice) return;
        let excelData = [
            ["رقم الفاتورة", lastSavedInvoice.id, "التاريخ", lastSavedInvoice.date],
            ["المورد", lastSavedInvoice.supplier || "نقدي"],
            ["ملاحظات", lastSavedInvoice.notes || ""],
            [],
            ["اسم الصنف", "سعر الشراء", "سعر البيع المسجل", "الكمية", "الإجمالي"]
        ];
        let sub = 0;
        lastSavedInvoice.items.forEach(item => {
            excelData.push([item.name, item.purchasePrice, item.price, item.qty, item.total]);
            sub += item.total;
        });
        excelData.push([]);
        excelData.push(["الإجمالي", sub]);
        excelData.push(["المدفوع", lastSavedInvoice.paid]);
        excelData.push(["المتبقي", lastSavedInvoice.remaining]);

        let ws = XLSX.utils.aoa_to_sheet(excelData);
        let wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "فاتورة الشراء");
        XLSX.writeFile(wb, `Purchase_Invoice_${lastSavedInvoice.id}.xlsx`);
        document.getElementById('bottomPrintBar').style.display = 'none';
        lastSavedInvoice = null;
    }
</script>
